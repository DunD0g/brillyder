name: Build BrillyDer iOS (.ipa)

on:
  push:
    branches: ["main"]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ipa.yml"
      - "src/data/starterCourses.json"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ipa.yml"
      - "src/data/starterCourses.json"
  workflow_dispatch:
    inputs:
      configuration:
        description: "Xcode build configuration"
        required: false
        default: "Release"
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: read

concurrency:
  group: "ios-ipa-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-ios-ipa:
    name: Build iOS 26 Native IPAs (App Store + Founder Admin)
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Xcode 26 & iOS SDK toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Verify starterCourses.json is in sync with Web PWA
        run: |
          diff -u src/data/starterCourses.json ios/Sources/BrillyDerCore/Resources/starterCourses.json

      - name: Run BrillyDerCore Swift unit tests
        working-directory: ios
        run: swift test

      - name: Install XcodeGen and generate BrillyDer.xcodeproj
        working-directory: ios
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
          ls -la BrillyDer.xcodeproj

      - name: Build BrillyDer (App Store Edition) & BrillyDerAdmin (Founder Edition)
        working-directory: ios
        env:
          BUILD_CONFIG: ${{ inputs.configuration || 'Release' }}
        run: |
          set -o pipefail
          for SCHEME in BrillyDer BrillyDerAdmin; do
            echo "=== Building $SCHEME ($BUILD_CONFIG) ==="
            xcodebuild build \
              -project BrillyDer.xcodeproj \
              -scheme "$SCHEME" \
              -configuration "$BUILD_CONFIG" \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build/DerivedData \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              AD_HOC_CODE_SIGNING_ALLOWED=NO
          done

      - name: Verify app bundles & package unsigned .ipa artifacts
        working-directory: ios
        env:
          BUILD_CONFIG: ${{ inputs.configuration || 'Release' }}
        run: |
          package_ipa() {
            local app_name="$1"
            local expected_bundle="$2"
            local ipa_name="$3"
            local app_path="build/DerivedData/Build/Products/${BUILD_CONFIG}-iphoneos/${app_name}.app"
            test -d "$app_path"
            test -f "$app_path/PrivacyInfo.xcprivacy"
            plutil -lint "$app_path/PrivacyInfo.xcprivacy"
            local actual_bundle
            actual_bundle="$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app_path/Info.plist")"
            test "$actual_bundle" = "$expected_bundle"
            /usr/libexec/PlistBuddy -c "Print :UILaunchScreen" "$app_path/Info.plist"
            /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryAddUsageDescription" "$app_path/Info.plist"
            /usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" "$app_path/Info.plist"
            find "$app_path" -name "starterCourses.json" | grep -q "starterCourses.json"
            find "$app_path" -name "cburnett_wK.png" | grep -q "cburnett_wK.png"
            find "$app_path" -name "brilly_buddy_thumbsup.png" | grep -q "brilly_buddy_thumbsup.png"
            find "$app_path" -name "brilly_buddy_blunder.png" | grep -q "brilly_buddy_blunder.png"

            rm -rf build/Payload "build/${ipa_name}"
            mkdir -p build/Payload
            cp -R "$app_path" build/Payload/
            (cd build && zip -r -y "$ipa_name" Payload >/dev/null)
          }

          package_ipa "BrillyDer" "com.brillyder.app" "BrillyDer-iOS-unsigned.ipa"
          package_ipa "BrillyDerAdmin" "com.brillyder.admin" "BrillyDer-Admin-iOS-unsigned.ipa"

          STORE_SIZE=$(du -h build/BrillyDer-iOS-unsigned.ipa | awk '{print $1}')
          ADMIN_SIZE=$(du -h build/BrillyDer-Admin-iOS-unsigned.ipa | awk '{print $1}')
          echo "Packaged BrillyDer-iOS-unsigned.ipa ($STORE_SIZE) & BrillyDer-Admin-iOS-unsigned.ipa ($ADMIN_SIZE)"

          {
            echo "## BrillyDer Native iOS Builds"
            echo ""
            echo "| Edition | Bundle ID | Artifact | Size |"
            echo "|---|---|---|---|"
            echo "| **App Store (StoreKit 2)** | \`com.brillyder.app\` | \`BrillyDer-iOS-unsigned.ipa\` | $STORE_SIZE |"
            echo "| **Founder Admin (All Pro Unlocked)** | \`com.brillyder.admin\` | \`BrillyDer-Admin-iOS-unsigned.ipa\` | $ADMIN_SIZE |"
            echo ""
            echo "- **Configuration:** \`$BUILD_CONFIG\`"
            echo "- **iOS SDK:** \`$(xcrun --sdk iphoneos --show-sdk-version)\`"
            echo "- **Checks Verified:** \`swift test\` passed, \`PrivacyInfo.xcprivacy\`, \`UILaunchScreen\`, \`NSPhotoLibraryAddUsageDescription\`, \`starterCourses.json\`, and piece sets bundled in both editions."
            echo ""
            echo "### Side-by-Side Installation"
            echo "Because **BrillyDer Admin** uses bundle ID \`com.brillyder.admin\`, you can sideload it right next to the App Store **BrillyDer** app (\`com.brillyder.app\`) on the same iPhone — and both update automatically on every commit."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload BrillyDer (App Store Edition) .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ (inputs.configuration || 'Release') == 'Release' && 'BrillyDer-iOS-unsigned-ipa' || 'BrillyDer-iOS-unsigned-debug-ipa' }}
          path: ios/build/BrillyDer-iOS-unsigned.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload BrillyDer Admin (Founder Edition) .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ (inputs.configuration || 'Release') == 'Release' && 'BrillyDer-Admin-iOS-unsigned-ipa' || 'BrillyDer-Admin-iOS-unsigned-debug-ipa' }}
          path: ios/build/BrillyDer-Admin-iOS-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
