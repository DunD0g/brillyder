name: BrillyDer
options:
  bundleIdPrefix: com.brillyder
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
packages:
  BrillyDer:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.11.3"
    CURRENT_PROJECT_VERSION: "15"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  BrillyDer:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - Info-Admin.plist
    dependencies:
      - package: BrillyDer
        product: BrillyDerCore
      - package: BrillyDer
        product: BrillyDerUI
      - target: BrillyDerWidgets
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: BrillyDer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIBackgroundModes:
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.brillyder.app.batch-processing
          - com.brillyder.app.batch-continued.*
        CFBundleURLTypes:
          - CFBundleURLName: com.brillyder.app
            CFBundleURLSchemes:
              - brillyder
        NSPhotoLibraryAddUsageDescription: "Save BrillyDer chess position share cards to your Photo Library."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchVoid
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brillyder.app
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: complete

  BrillyDerAdmin:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - Info-Admin.plist
    dependencies:
      - package: BrillyDer
        product: BrillyDerCore
      - package: BrillyDer
        product: BrillyDerUI
      - target: BrillyDerAdminWidgets
        embed: true
    info:
      path: App/Info-Admin.plist
      properties:
        CFBundleDisplayName: BrillyDer Admin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIBackgroundModes:
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.brillyder.admin.batch-processing
          - com.brillyder.admin.batch-continued.*
        CFBundleURLTypes:
          - CFBundleURLName: com.brillyder.admin
            CFBundleURLSchemes:
              - brillyder
        NSPhotoLibraryAddUsageDescription: "Save BrillyDer chess position share cards to your Photo Library."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchVoid
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brillyder.admin
        INFOPLIST_FILE: App/Info-Admin.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) BRILLY_ADMIN_EDITION"

  BrillyDerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - Info.plist
          - Info-Admin.plist
    dependencies:
      - package: BrillyDer
        product: BrillyDerActivityKit
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: BrillyDer Live
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brillyder.app.widgets
        INFOPLIST_FILE: Widgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: complete
        SKIP_INSTALL: YES

  BrillyDerAdminWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - Info.plist
          - Info-Admin.plist
    dependencies:
      - package: BrillyDer
        product: BrillyDerActivityKit
    info:
      path: Widgets/Info-Admin.plist
      properties:
        CFBundleDisplayName: BrillyDer Admin Live
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brillyder.admin.widgets
        INFOPLIST_FILE: Widgets/Info-Admin.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: complete
        SKIP_INSTALL: YES

schemes:
  BrillyDer:
    build:
      targets:
        BrillyDer: all
    run:
      config: Debug
      storeKitConfiguration: BrillyDer.storekit
    archive:
      config: Release
  BrillyDerAdmin:
    build:
      targets:
        BrillyDerAdmin: all
    run:
      config: Debug
    archive:
      config: Release
