name: BrillyDer
options:
  bundleIdPrefix: com.brillyder
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
packages:
  BrillyDer:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.10.0"
    CURRENT_PROJECT_VERSION: "13"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  BrillyDer:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - Info-Admin.plist
    dependencies:
      - package: BrillyDer
        product: BrillyDerCore
      - package: BrillyDer
        product: BrillyDerUI
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: BrillyDer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSPhotoLibraryAddUsageDescription: "Save BrillyDer chess position share cards to your Photo Library."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchVoid
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brillyder.app
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: complete

  BrillyDerAdmin:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - Info-Admin.plist
    dependencies:
      - package: BrillyDer
        product: BrillyDerCore
      - package: BrillyDer
        product: BrillyDerUI
    info:
      path: App/Info-Admin.plist
      properties:
        CFBundleDisplayName: BrillyDer Admin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSPhotoLibraryAddUsageDescription: "Save BrillyDer chess position share cards to your Photo Library."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchVoid
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brillyder.admin
        INFOPLIST_FILE: App/Info-Admin.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) BRILLY_ADMIN_EDITION"

schemes:
  BrillyDer:
    build:
      targets:
        BrillyDer: all
    run:
      config: Debug
      storeKitConfiguration: BrillyDer.storekit
    archive:
      config: Release
  BrillyDerAdmin:
    build:
      targets:
        BrillyDerAdmin: all
    run:
      config: Debug
    archive:
      config: Release
